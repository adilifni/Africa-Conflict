<div id="view-profile" class="game-view" style="display: flex; flex-direction: column; gap: 15px;">

        <!-- شريط المستوى والـ XP -->

            <div style="display: flex; justify-content: space-between; margin-top: 15px; padding: 0 5px; font-weight: bold; font-size: 16px;">

        </div>
    </div>

    <!-- بلوك المنطقة والجنسية -->
    <div class="info-block" style="background: #1a1f26; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #2d3748;">
        <div style="display: flex; justify-content: space-between; color: #fff; border-bottom: 1px solid #2d3748; padding-bottom: 8px;">
           <span style="color: #a0aec0;">المنطقة </span>

        <div style="display: flex; justify-content: space-between; color: #fff; padding-top: 4px;">

    <!-- قوائم التطوير المنزلقة -->

<div class="upgradeable-card stat-card-box" data-dropdown="energy-dropdown">
    <div class="card-header-main">
        <span>⚡ مستوى الطاقة</span>
        <span id="energy-value">53</span>
    </div>
    <div id="energy-dropdown" class="upgrade-dropdown" style="display: none;">
        <div style="padding: 10px 0; display: flex; flex-direction: column; gap: 10px;">
            <p style="color: #a0aec0; margin: 0; font-size: 13px;">الوقت المستغرق: 3 دقائق</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-upgrade-action" data-skill="energy" data-currency="money" style="flex: 1; background: #2b6cb0; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">50 مال</button>
                <button class="btn-upgrade-action" data-skill="energy" data-currency="gold" style="flex: 1; background: #d69e2e; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">2 ذهب</button>
            </div>
        </div>
    </div>
</div>

<script>
// تفعيل الاستماع للأحداث برمجياً لضمان عدم ضياعها في الـ Modules
document.querySelectorAll('.stat-card-box').forEach(card => {
    card.addEventListener('click', function() {
        const dropdownId = this.getAttribute('data-dropdown');
        const dropdown = document.getElementById(dropdownId);
        
        // إغلاق باقي القوائم المنسدلة
        document.querySelectorAll('.upgrade-dropdown').forEach(item => {
            if (item.id !== dropdownId) {
                item.style.display = 'none';
            }
        });

        // تبديل العرض للقائمة الحالية
        if (dropdown.style.display === 'none' || dropdown.style.display === '') {
            dropdown.style.display = 'block';
        } else {
            dropdown.style.display = 'none';
        }
    });
});

// تفعيل أزرار التطوير الداخلية ومنع إغلاق القائمة عند الضغط عليها
document.querySelectorAll('.btn-upgrade-action').forEach(btn => {
    btn.addEventListener('click', function(event) {
        event.stopPropagation(); // منع انتقال النقرة للبطاقة الرئيسية
        const skill = this.getAttribute('data-skill');
        const currency = this.getAttribute('data-currency');
        
        console.log("جاري تطوير المهارة: " + skill + " باستخدام العملة: " + currency);
        alert("جاري تطوير " + skill + " باستخدام " + currency);
    });
});
</script>
</div>
