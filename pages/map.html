<!-- صفحة الخريطة التفاعلية -->
<div id="view-continent-map" class="game-view" style="display:none; flex-direction:column; gap:15px;">

    <!-- بلوك عرض العلم المحدد — يظهر فقط بعد الضغط على أي دولة بالخريطة -->
    <div id="map-selected-flag-box" style="display:none; align-items:center; gap:14px; background:#1a1f26; border:1px solid #2d3748; border-radius:12px; padding:15px; cursor:pointer;">
        <div id="map-selected-flag-emoji" style="font-size:42px; line-height:1;"></div>
        <div style="flex:1; text-align:right;">
            <div id="map-selected-country-name" style="color:#fff; font-weight:bold; font-size:17px;"></div>
            <div style="color:#a0aec0; font-size:12px; margin-top:4px;">اضغط على الدولة مرة أخرى (أو هنا) للدخول إلى صفحتها</div>
        </div>
        <button id="map-travel-btn" onclick="event.stopPropagation(); startTravel(this.getAttribute('data-target-country'))" style="background:#2b6cb0;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;">✈️ سافر</button>
    </div>

    <!-- الخريطة نفسها -->
    <div style="background:#1a1f26; border:1px solid #2d3748; border-radius:12px; padding:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div style="color:#fff; font-weight:bold; font-size:15px;">🗺️ خريطة القارة الإفريقية</div>
            <div style="display:flex; gap:6px;">
                <button id="map-zoom-out-btn" style="background:#2d3748;color:#fff;border:none;width:30px;height:30px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;">−</button>
                <button id="map-zoom-reset-btn" style="background:#2d3748;color:#fff;border:none;width:30px;height:30px;border-radius:6px;font-size:12px;cursor:pointer;">⟲</button>
                <button id="map-zoom-in-btn" style="background:#2d3748;color:#fff;border:none;width:30px;height:30px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;">+</button>
            </div>
        </div>

        <!-- الإطار المرئي الثابت (يقصّ أي جزء يخرج بعد التكبير) -->
        <div id="map-zoom-wrapper" style="position:relative; width:100%; padding-top:100%; background:#0f1620; border-radius:10px; overflow:hidden; touch-action:none; cursor:grab;">
            <!-- الطبقة القابلة للتكبير/التحريك فعلياً (الصورة + النقاط معاً حتى تتحركا كوحدة واحدة) -->
            <div id="map-zoom-viewport" style="position:absolute; top:0; left:0; width:100%; height:100%; transform-origin:center center; transition:transform .05s linear;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/86/Africa_%28orthographic_projection%29.svg" alt="Africa" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; opacity:0.9; pointer-events:none;">
                <div id="map-pins-container" style="position:absolute; top:0; left:0; width:100%; height:100%;"></div>
            </div>
        </div>

        <p style="color:#718096; font-size:11px; text-align:center; margin-top:10px;">قرّب بإصبعين أو بعجلة الفأرة، أو استخدم أزرار +/− — مواضع الدول محسوبة من إحداثياتها الجغرافية الحقيقية</p>
    </div>

</div>

<!-- صفحة الدولة — مؤقتة حالياً (Placeholder)، سنطورها بالتفصيل لاحقاً -->
<div id="view-country-detail" class="game-view" style="display:none; flex-direction:column; gap:15px;">
    <div style="background:#1a1f26; border:1px solid #2d3748; border-radius:12px; padding:25px; text-align:center;">
        <div id="country-detail-flag" style="font-size:64px; margin-bottom:10px;"></div>
        <div id="country-detail-name" style="color:#fff; font-weight:bold; font-size:22px; margin-bottom:15px;"></div>
        <p style="color:#a0aec0; font-size:14px; line-height:1.8;">
            صفحة الدولة قيد التطوير حالياً 🚧<br>
            ستحتوي مستقبلاً على معلومات الدولة، رئيسها، برلمانها، واقتصادها.
        </p>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button onclick="switchView('continent-map')" style="flex:1;background:#2d3748; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">⬅️ رجوع للخريطة</button>
            <button id="country-detail-travel-btn" onclick="startTravel(this.getAttribute('data-target-country'))" style="flex:1;background:#2b6cb0; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">✈️ سافر إلى هنا</button>
        </div>
    </div>
</div>

<style>
.map-country-pin {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    z-index: 2;
}
.map-pin-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #e53e3e;
    border: 2px solid #fff;
    box-shadow: 0 0 5px rgba(0,0,0,.6);
    transition: transform .15s ease, background .15s ease;
    display: block;
}
.map-country-pin:active .map-pin-dot {
    transform: scale(0.85);
}
.map-country-pin.selected .map-pin-dot {
    background: #38a169;
    transform: scale(1.5);
}
#map-zoom-wrapper:active {
    cursor: grabbing;
}
</style>
